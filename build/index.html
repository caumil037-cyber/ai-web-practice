<title>음식건강 지키미</title>
<style>
  :root {

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1a18; --card: #242421; --line: #383833;
      --text: #ecece6; --muted: #a3a39a; --accent: #8fc2a3;
      --badge-bg: #33332e; --badge-text: #b9b9b0;
      --warn-bg: #3d3323; --warn-text: #e0b96c; --warn-line: #5c4a2b;
      --btn-text: #14201a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1a18; --card: #242421; --line: #383833;
    --text: #ecece6; --muted: #a3a39a; --accent: #8fc2a3;
    --badge-bg: #33332e; --badge-text: #b9b9b0;
    --warn-bg: #3d3323; --warn-text: #e0b96c; --warn-line: #5c4a2b;
    --btn-text: #14201a;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 16px 64px;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Malgun Gothic", "Noto Sans KR", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 560px; margin: 0 auto; }

  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .tagline { color: var(--muted); font-size: 13px; margin: 0 0 28px; }

  label { display: block; font-size: 15px; margin-bottom: 8px; }
  .hint { color: var(--muted); font-size: 13px; margin: 0 0 10px; }

  textarea {
    width: 100%; min-height: 76px; padding: 12px;
    font: inherit; font-size: 15px; color: var(--text);
    background: var(--card); border: 1px solid var(--line);
    border-radius: 8px; resize: vertical;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  button.check {
    display: block; width: 100%; margin-top: 12px; padding: 12px;
    font: inherit; font-size: 16px; font-weight: 600;
    color: var(--btn-text); background: var(--accent);
    border: 0; border-radius: 8px; cursor: pointer;
  }

  .divider {
    display: flex; align-items: center; gap: 12px;
    margin: 32px 0 16px; color: var(--muted); font-size: 13px;
  }
  .divider::before, .divider::after {
    content: ""; flex: 1; height: 1px; background: var(--line);
  }

  .pair {
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--card); margin-bottom: 8px; overflow: hidden;
  }
  .pair > summary {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px; cursor: pointer; font-size: 15px; list-style: none;
  }
  .pair > summary::-webkit-details-marker { display: none; }
  .arrow { color: var(--muted); font-size: 12px; width: 12px; }
  .pair[open] .arrow::before { content: "\25BE"; }
  .pair:not([open]) .arrow::before { content: "\25B8"; }
  .pair-name { flex: 1; }

  .badge {
    font-size: 12px; padding: 2px 8px; border-radius: 999px;
    background: var(--badge-bg); color: var(--badge-text); white-space: nowrap;
  }
  .badge.warn {
    background: var(--warn-bg); color: var(--warn-text);
    border: 1px solid var(--warn-line);
  }

  .detail { border-top: 1px solid var(--line); padding: 14px; font-size: 14px; }
  .detail h3 {
    font-size: 12px; font-weight: 600; color: var(--muted);
    margin: 0 0 4px; letter-spacing: 0.02em;
  }
  .detail section + section { margin-top: 14px; }
  .detail p { margin: 0; }
  .myth { font-style: italic; }
  .detail a { color: var(--accent); }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .claim {
    border-left: 3px solid var(--line); padding-left: 10px; color: var(--muted);
  }

  .empty {
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--card); padding: 20px 14px; text-align: center;
  }
  .empty p { margin: 0; }

  .note { margin-top: 28px; color: var(--muted); font-size: 12px; line-height: 1.7; }
  .note b { color: var(--text); }
</style>
</head>

<div class="wrap">

  <h1>음식건강 지키미</h1>
  <p class="tagline">들었던 음식 속설이 진짜인지 확인합니다.</p>

  <label for="input">오늘 먹을 재료를 적어주세요</label>
  <p class="hint">쉼표(,)로 구분해서 적어주세요. 예: 감, 게, 삼겹살, 소주</p>
  <textarea id="input" placeholder="감, 게, 삼겹살, 소주"></textarea>
  <button class="check" id="checkBtn">검사하기</button>

  <div id="result"></div>

  <p class="note">
    <b>판정이 확실하지 않으면 「확인 필요」라고 말합니다. 그럴듯하게 지어내지 않습니다.</b><br>
    · <b>근거 없음</b> — 전문가가 "근거 없는 속설"이라고 확인한 것입니다.<br>
    · <b>확인 필요</b> — 속설은 있지만 <b>아직 검증하지 못했습니다.</b> 맞다는 뜻도, 틀리다는 뜻도 아닙니다.<br>

  </p>

</div>

    "claim": "콩은 고단백 고지방 식품이며 인산의 함량이 많은 식품이다. 그런데 치즈와 콩류를 함께 먹으면 인산 칼슘이 만들어져 흡수되지 않고 몸밖으로 빠져 나가게 된다.",
    "experts": "",
    "source": "해당 데이터가 밝힌 원 출처: 우리들의 한방넷(urihanbang.org)",
    "link": "https://www.data.go.kr/data/15050016/fileData.do"
  }
];

var input = document.getElementById("input");
var result = document.getElementById("result");

document.getElementById("checkBtn").addEventListener("click", check);
input.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) check();
});

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}

/* 쉼표로 나누고, 공백 제거하고, 빈 것과 중복을 뺀다 */
function parse(text) {
  var seen = {}, out = [];
  text.split(",").forEach(function (raw) {
    var name = raw.trim();
    if (!name || seen[name]) return;
    seen[name] = true;
    out.push(name);
  });
  return out;
}

/* 넣은 재료로 짝을 다 만들어 데이터와 대조 */
function findMatches(items) {
  var hits = [];
  for (var i = 0; i < items.length; i++) {
    for (var j = i + 1; j < items.length; j++) {
      var x = items[i], y = items[j];
      DATA.forEach(function (row) {
        if ((row.a === x && row.b === y) || (row.a === y && row.b === x)) {
          hits.push({ left: x, right: y, row: row });
        }
      });
    }
  }
  /* 검증된 판정(근거 없음)을 위로 */
  return hits.sort(function (p, q) {
    return (p.row.verdict === "근거 없음" ? 0 : 1) - (q.row.verdict === "근거 없음" ? 0 : 1);
  });
}

function detail(r) {
  var html = "";

  html += '<section><h3>속설</h3>' +
          '<p class="myth">&ldquo;' + esc(r.myth) + '&rdquo;</p>';
  if (r.mythFrom) html += '<p class="sub">' + esc(r.mythFrom) + '</p>';
  html += '</section>';

  html += '<section><h3>판정</h3><p>' + esc(r.verdict) + '</p>';
  if (r.verdict === "확인 필요") {
    html += '<p class="sub">전문가 자료로 아직 대조하지 못했습니다. ' +
            '맞다는 뜻도, 틀리다는 뜻도 아닙니다.</p>';
  }
  html += '</section>';

  if (r.claim) {
    var label = (r.verdict === "근거 없음")
      ? "속설 쪽 주장 (판정 근거 아님)"
      : "데이터가 말하는 이유 (검증 안 됨)";
    html += '<section><h3>' + label + '</h3>' +
            '<p class="claim">' + esc(r.claim) + '</p></section>';
  }

  html += '<section><h3>근거 출처</h3><p>';
  if (r.experts) html += esc(r.experts) + '<br>';
  html += esc(r.source);
  if (r.link) {
    html += ' · <a href="' + esc(r.link) + '" target="_blank" rel="noopener">원문 보기</a>';
  }
  html += '</p></section>';

  return html;
}

function check() {
  var hits = findMatches(parse(input.value));
  var html = '<div class="divider">결과</div>';

  if (hits.length === 0) {
    html += '<div class="empty">' +
              '<p>등록된 속설이 없습니다.</p>' +
              '<p class="sub">(아직 ' + DATA.length + '쌍만 등록되어 있습니다)</p>' +
            '</div>';
  } else {
    hits.forEach(function (hit) {
      var r = hit.row;
      var cls = (r.verdict === "근거 없음") ? "badge" : "badge warn";
      html += '<details class="pair">' +
                '<summary>' +
                  '<span class="arrow"></span>' +
                  '<span class="pair-name">' + esc(hit.left) + ' + ' + esc(hit.right) + '</span>' +
                  '<span class="' + cls + '">' + esc(r.verdict) + '</span>' +
                '</summary>' +
                '<div class="detail">' + detail(r) + '</div>' +
              '</details>';
    });
  }
  result.innerHTML = html;
}
</script>
</body>
</html>
