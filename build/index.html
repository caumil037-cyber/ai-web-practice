<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>음식건강 지키미</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --line: #e2e2dd;
    --text: #23231f;
    --muted: #6d6d66;
    --accent: #3b6e4f;
    --badge-bg: #efeeea;
    --badge-text: #5a5a52;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1a18;
      --card: #242421;
      --line: #383833;
      --text: #ecece6;
      --muted: #a3a39a;
      --accent: #8fc2a3;
      --badge-bg: #33332e;
      --badge-text: #b9b9b0;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1a18;
    --card: #242421;
    --line: #383833;
    --text: #ecece6;
    --muted: #a3a39a;
    --accent: #8fc2a3;
    --badge-bg: #33332e;
    --badge-text: #b9b9b0;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 16px 64px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Malgun Gothic", "Noto Sans KR", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 560px; margin: 0 auto; }

  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .tagline { color: var(--muted); font-size: 13px; margin: 0 0 28px; }

  label { display: block; font-size: 15px; margin-bottom: 8px; }
  .hint { color: var(--muted); font-size: 13px; margin: 0 0 10px; }

  textarea {
    width: 100%;
    min-height: 76px;
    padding: 12px;
    font: inherit;
    font-size: 15px;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    resize: vertical;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  button.check {
    display: block;
    width: 100%;
    margin-top: 12px;
    padding: 12px;
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 8px;
    cursor: pointer;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) button.check { color: #14201a; }
  }
  :root[data-theme="dark"] button.check { color: #14201a; }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 32px 0 16px;
    color: var(--muted);
    font-size: 13px;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .pair {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--card);
    margin-bottom: 8px;
    overflow: hidden;
  }
  .pair > summary {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 14px;
    cursor: pointer;
    font-size: 15px;
    list-style: none;
  }
  .pair > summary::-webkit-details-marker { display: none; }
  .arrow { color: var(--muted); font-size: 12px; width: 12px; }
  .pair[open] .arrow::before { content: "▾"; }
  .pair:not([open]) .arrow::before { content: "▸"; }
  .pair-name { flex: 1; }
  .badge {
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--badge-bg);
    color: var(--badge-text);
    white-space: nowrap;
  }

  .detail {
    border-top: 1px solid var(--line);
    padding: 14px;
    font-size: 14px;
  }
  .detail h3 {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin: 0 0 4px;
    letter-spacing: 0.02em;
  }
  .detail section + section { margin-top: 14px; }
  .detail p { margin: 0; }
  .myth { font-style: italic; }
  .detail a { color: var(--accent); }

  .empty {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--card);
    padding: 20px 14px;
    text-align: center;
  }
  .empty p { margin: 0; }
  .empty .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }

  .note {
    margin-top: 28px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.7;
  }
</style>
</head>
<body>
<div class="wrap">

  <h1>음식건강 지키미</h1>
  <p class="tagline">들었던 음식 속설이 진짜인지 확인합니다.</p>

  <label for="input">오늘 먹을 재료를 적어주세요</label>
  <p class="hint">쉼표(,)로 구분해서 적어주세요. 예: 감, 게, 삼겹살, 소주</p>
  <textarea id="input" placeholder="감, 게, 삼겹살, 소주"></textarea>
  <button class="check" id="checkBtn">검사하기</button>

  <div id="result"></div>

  <p class="note">
    판정이 확실하지 않으면 <b>근거 없음</b>이라고 말합니다. 그럴듯하게 지어내지 않습니다.<br>
    ※ 현재는 샘플 데이터입니다. 감을 "홍시"나 "단감"으로 적으면 찾지 못합니다.
  </p>

</div>

<script>
/* ------------------------------------------------------------------
   샘플 데이터 10개.
   id 1~5 : PLAN.md 3-6 의 검증된 5쌍. 출처 확인됨.
   id 6~10: 자리만 채운 샘플. 근거를 확인하지 못했으므로 출처를
            지어내지 않고 "[확인 필요]"로 둔다. 진짜 데이터로 교체할 것.
   ------------------------------------------------------------------ */
var DATA = [
  {
    a: "감", b: "게",
    myth: "게 먹고 감 먹으면 안 된다",
    verdict: "근거 없음",
    experts: "최낙언(좋은식품정보 대표), 명승권(국립암센터 교수)",
    source: "주간경향 / 뉴스톱 팩트체크",
    link: "https://www.newstopkorea.com/news/articleView.html?idxno=1747"
  },
  {
    a: "삼겹살", b: "소주",
    myth: "삼겹살에 소주를 같이 먹으면 안 된다",
    verdict: "근거 없음",
    experts: "정재훈(약사)",
    source: "주간경향",
    link: "https://weekly.khan.co.kr/article/202001171824441"
  },
  {
    a: "치킨", b: "맥주",
    myth: "치킨에 맥주를 같이 먹으면 안 된다",
    verdict: "근거 없음",
    experts: "명승권(국립암센터 교수)",
    source: "주간경향",
    link: "https://weekly.khan.co.kr/article/202001171824441"
  },
  {
    a: "시금치", b: "두부",
    myth: "시금치와 두부를 같이 먹으면 안 된다",
    verdict: "근거 없음",
    experts: "최낙언(좋은식품정보 대표)",
    source: "주간경향",
    link: "https://weekly.khan.co.kr/article/202001171824441"
  },
  {
    a: "감", b: "도토리묵",
    myth: "감과 도토리묵을 같이 먹으면 안 된다",
    verdict: "근거 없음",
    experts: "최낙언(좋은식품정보 대표)",
    source: "주간경향",
    link: "https://weekly.khan.co.kr/article/202001171824441"
  },

  /* --- 아래 5개는 내용 미검증. 실제 데이터로 교체 필요 --- */
  {
    a: "샘플재료1", b: "샘플재료2",
    myth: "[확인 필요]",
    verdict: "근거 없음",
    experts: "[확인 필요]",
    source: "[확인 필요]",
    link: ""
  },
  {
    a: "샘플재료3", b: "샘플재료4",
    myth: "[확인 필요]",
    verdict: "근거 없음",
    experts: "[확인 필요]",
    source: "[확인 필요]",
    link: ""
  },
  {
    a: "샘플재료5", b: "샘플재료6",
    myth: "[확인 필요]",
    verdict: "근거 없음",
    experts: "[확인 필요]",
    source: "[확인 필요]",
    link: ""
  },
  {
    a: "샘플재료7", b: "샘플재료8",
    myth: "[확인 필요]",
    verdict: "근거 없음",
    experts: "[확인 필요]",
    source: "[확인 필요]",
    link: ""
  },
  {
    a: "샘플재료9", b: "샘플재료10",
    myth: "[확인 필요]",
    verdict: "근거 없음",
    experts: "[확인 필요]",
    source: "[확인 필요]",
    link: ""
  }
];

var input = document.getElementById("input");
var result = document.getElementById("result");

document.getElementById("checkBtn").addEventListener("click", check);
input.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) check();
});

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}

/* 쉼표로 나누고, 공백 제거하고, 빈 것과 중복을 뺀다 */
function parse(text) {
  var seen = {};
  var out = [];
  text.split(",").forEach(function (raw) {
    var name = raw.trim();
    if (!name || seen[name]) return;
    seen[name] = true;
    out.push(name);
  });
  return out;
}

/* 넣은 재료로 짝을 다 만들어 데이터와 대조 */
function findMatches(items) {
  var hits = [];
  for (var i = 0; i < items.length; i++) {
    for (var j = i + 1; j < items.length; j++) {
      var x = items[i], y = items[j];
      DATA.forEach(function (row) {
        var match = (row.a === x && row.b === y) || (row.a === y && row.b === x);
        if (match) hits.push({ left: x, right: y, row: row });
      });
    }
  }
  return hits;
}

function check() {
  var items = parse(input.value);
  var hits = findMatches(items);
  var html = '<div class="divider">결과</div>';

  if (hits.length === 0) {
    html +=
      '<div class="empty">' +
        '<p>등록된 속설이 없습니다.</p>' +
        '<p class="sub">(아직 ' + DATA.length + '쌍만 등록되어 있습니다)</p>' +
      '</div>';
  } else {
    hits.forEach(function (hit) {
      var r = hit.row;
      var sourceLine = r.link
        ? esc(r.source) + ' · <a href="' + esc(r.link) + '" target="_blank" rel="noopener">기사 보기</a>'
        : esc(r.source);
      html +=
        '<details class="pair">' +
          '<summary>' +
            '<span class="arrow"></span>' +
            '<span class="pair-name">' + esc(hit.left) + ' + ' + esc(hit.right) + '</span>' +
            '<span class="badge">' + esc(r.verdict) + '</span>' +
          '</summary>' +
          '<div class="detail">' +
            '<section><h3>속설</h3><p class="myth">&ldquo;' + esc(r.myth) + '&rdquo;</p></section>' +
            '<section><h3>판정</h3><p>' + esc(r.verdict) + '</p></section>' +
            '<section><h3>근거 출처</h3><p>' + esc(r.experts) + '<br>' + sourceLine + '</p></section>' +
          '</div>' +
        '</details>';
    });
  }

  result.innerHTML = html;
}
</script>
</body>
</html>
